services:

  nginx:
    image: nginx:alpine
    container_name: nginx_server

    ports:
      - "${APP_PORT}:80"

    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      php:
        condition: service_healthy

    networks:
      - backend

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile

    container_name: php_fpm

    volumes:
      - ./app:/var/www/html

    environment:
      APP_ENV: ${APP_ENV}

    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - backend

networks:
  backend:
    driver: bridge